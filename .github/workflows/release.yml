name: Release

on:
  push:
    branches: [main]
  # Builds Joinery again for a release that's been made, such as after a failed build.
  workflow_dispatch:
    inputs:
      version:
        description: The Joinery release to build, such as 0.2.0
        required: true

permissions:
  contents: write
  pull-requests: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/joinery-relay
  CHARTS: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  # Opens a release pull request for each part as changes land; merging one makes the release.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.release.outputs.release_created }}
      app_version: ${{ steps.release.outputs.version }}
      app_tag: ${{ steps.release.outputs.tag_name }}
      relay: ${{ steps.release.outputs['relay--release_created'] }}
      relay_version: ${{ steps.release.outputs['relay--version'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  relay:
    needs: release-please
    if: needs.release-please.outputs.relay == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.release-please.outputs.relay_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        run: echo "tags=$IMAGE:$VERSION,$IMAGE:${VERSION%.*},$IMAGE:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: relay
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Joinery's relay
            org.opencontainers.image.version=${{ env.VERSION }}
      - uses: azure/setup-helm@v4
      - name: Chart
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package relay/chart --destination build
          helm push "build/joinery-relay-$VERSION.tgz" "$CHARTS"

  # Signed, notarized, and added to the update feed released copies check: appcast.xml on the `updates` release,
  # which is never the latest, so relay releases can't take its place.
  app:
    needs: release-please
    if: needs.release-please.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    env:
      VERSION: ${{ inputs.version || needs.release-please.outputs.app_version }}
      TAG: joinery-v${{ inputs.version || needs.release-please.outputs.app_version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          p12-password: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
      # Apple's intermediate, so the signing chain is whole however the .p12 was exported.
      - name: Developer ID intermediate certificate
        run: |
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k signing_temp.keychain || echo "Already there."
      - name: Keys
        run: |
          mkdir -p "$RUNNER_TEMP/keys" build/release
          echo "${{ secrets.NOTARY_API_KEY }}" > "$RUNNER_TEMP/keys/notary.p8"
          echo "${{ secrets.SPARKLE_PRIVATE_KEY }}" > "$RUNNER_TEMP/keys/sparkle.key"
          gh release view updates >/dev/null 2>&1 || gh release create updates --prerelease --latest=false \
            --title "Update feed" --notes "Where released copies of Joinery check for updates. Download the newest at Joinery.dmg."
          gh release download updates --pattern appcast.xml --dir build/release || echo "No feed yet; starting one."
      - run: pipx install dmgbuild
      - name: Build, sign and notarize
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_KEY_PATH: ${{ runner.temp }}/keys/notary.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
          SPARKLE_KEY_PATH: ${{ runner.temp }}/keys/sparkle.key
          FEED_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/updates/appcast.xml
          DOWNLOAD_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ env.TAG }}
        run: scripts/package-app.sh
      - name: Publish
        run: |
          gh release upload "$TAG" "build/release/Joinery-$VERSION.dmg"
          cp "build/release/Joinery-$VERSION.dmg" build/release/Joinery.dmg
          gh release upload updates build/release/appcast.xml build/release/Joinery.dmg --clobber
