name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  ZIG_VERSION: 0.17.0
  IMAGE: ghcr.io/${{ github.repository_owner }}/joinery-relay

jobs:
  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig fmt --check build.zig src
      - run: zig build test --summary all

  # The image and chart installed in a throwaway cluster, with real sessions through the Service.
  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: relay
          load: true
          tags: joinery-relay:ci
      - uses: helm/kind-action@v1
        with:
          cluster_name: ci
      - run: kind load docker-image joinery-relay:ci --name ci
      - run: helm lint relay/chart
      - run: >
          helm install relay relay/chart --wait --timeout 2m
          --set image.repository=docker.io/library/joinery-relay --set image.tag=ci --set image.pullPolicy=Never
          --set threads=2
      - name: Sessions through the Service
        working-directory: relay
        run: |
          kubectl port-forward svc/relay-joinery-relay 8787:8787 9187:9187 &
          sleep 3
          zig build load -- --rooms 50 --guests 3 --rate 20 --presence 5 --seconds 3 --threads 2 2>&1 | tee load.txt
          grep -qE "\((9[5-9]|10[0-9])% of" load.txt
          curl -fsS localhost:9187/metrics | grep "^joinery_relay_rooms 50$"

  image:
    needs: [relay, kubernetes]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: relay
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:main,${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Joinery's relay

  app:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: >
          xcodebuild test -project Joinery.xcodeproj -scheme Joinery -destination platform=macOS
          -derivedDataPath build/derived CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
