apiVersion: v1
kind: Service
metadata:
  name: {{ include "relay.fullname" . }}
  labels:
    {{- include "relay.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "relay.selectorLabels" . | nindent 4 }}
  ports:
    - name: relay
      port: {{ .Values.service.port }}
      targetPort: relay
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
