image:
  repository: ghcr.io/mtsaas/joinery-relay
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# Event loops. The relay counts the cores it can see, not its CPU limit, so set this to about half the CPUs it's
# given: the kernel's network work needs the rest. Empty: half the node's cores.
threads: ""
# How long, in ms, a connection's queue waits for more before it's sent. 5 does the same work with about 40% less CPU.
batchMs: 5
# What anyone can make the relay hold, without signing in. At worst a room holds its log and a snapshot, about 4 MiB,
# a connection a snapshot's worth of input, about 1 MiB, and connections that are behind outboxMib between them: these
# keep that under the 2Gi limit below. Raise them with it. Past them, hosts are told the relay is full, new connections
# are closed, and the connection behind longest is closed; sessions already open carry on.
maxRooms: 256
maxConnections: 768
outboxMib: 128
extraArgs: []

# One relay, always. Rooms live in its memory, and a room's host and guests must reach the same relay, so a second
# replica behind the same Service would split rooms. Updates replace it (Recreate): sessions reconnect and catch up.

service:
  type: ClusterIP
  port: 8787
  annotations: {}

# Presence over UDP beside each WebSocket (docs/relay.md, "Presence over UDP"): clients that can reach it send pointer
# updates as datagrams, which costs the relay a third less CPU; the rest carry on by WebSocket. An HTTP ingress can't
# carry UDP, so this makes a LoadBalancer Service for it, and tickets tell clients where it is: `host` (empty: the
# WebSocket's host, if UDP reaches that address too) and `port`.
udp:
  enabled: false
  host: ""
  port: 443
  service:
    type: LoadBalancer
    annotations: {}

metrics:
  port: 9187
  # Prometheus scrape annotations on the pod.
  annotations: true
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

# WebSockets need nothing special from most ingress controllers; set the read timeout well above a minute, as an
# idle session pings every ten seconds.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: relay.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 500m
    memory: 256Mi
  limits:
    memory: 2Gi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
